version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mangatech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mangatech_user
      POSTGRES_PASSWORD: mangatech_password
      POSTGRES_DB: mangatech
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mangatech_user -d mangatech"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
